<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4eadc">
  <meta name="description" content="은유제작소 EUNYU MADE 명함 페이지. 홈페이지, 소셜, 메일, 연락처 저장.">
  <title>은유제작소 | 명함</title>
  <link rel="icon" href="assets/logo/eunyu-logo.png">
  <style>
    :root{
      --bg:#f4eadc; --paper:#fffdf8; --ink:#4d3a2d; --muted:#8f7a68;
      --line:#dccab5; --orange:#ce7b3e; --shadow:0 18px 60px rgba(91,70,54,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font:inherit;color:inherit}
    .wrap{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px 24px 24px;box-shadow:var(--shadow)}
    .card img.logo{width:168px;height:auto;margin:0 0 18px}
    .card h1{font-size:1.45rem;letter-spacing:-.03em;line-height:1.2;margin:0}
    .card h1 small{display:block;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--orange);margin-top:6px}
    .card p{margin:12px 0 0;color:var(--muted);font-size:.98rem}
    .sample{display:flex;gap:14px;align-items:center;margin-top:18px;padding:14px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
    .sample img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none;background:#fff}
    .sample b{display:block;font-size:.98rem}
    .sample span{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
    .sample .go{margin-left:auto;flex:none;font-weight:800;color:var(--orange);font-size:1.2rem}
    .links{display:grid;gap:10px;margin-top:18px}
    .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 20px;border-radius:999px;
      background:var(--paper);border:1px solid var(--line);font-weight:750;font-size:1rem;cursor:pointer;text-align:left;width:100%;
      transition:transform .15s ease,background .15s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
    .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .btn .sub{font-weight:500;font-size:.82rem;color:var(--muted);white-space:nowrap}
    .btn.primary .sub{color:#d6c9bd}
    .btn[hidden]{display:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .foot{margin-top:22px;text-align:center;font-size:.78rem;color:var(--muted)}
    .foot a{border-bottom:1px solid var(--line)}
    @media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <img class="logo" data-logo alt="은유제작소 EUNYU MADE 로고">
    <h1>은유제작소<small>EUNYU MADE</small></h1>
    <p>상상과 생각, 감정과 이야기를 장난감, 로봇, 게임, 웹으로 옮겨 실제로 만지고 보고 들을 수 있는 경험으로 만듭니다.</p>
  </section>

  <a class="sample" href="/happy?from=card" aria-label="HAPPY 체험해보기">
    <img data-img="happyMain" alt="">
    <span>
      <b>HAPPY 체험해보기</b>
      <span>웹 로봇을 쓰다듬고, 간식 게임을 해 보세요.</span>
    </span>
    <span class="go" aria-hidden="true">→</span>
  </a>

  <nav class="links" aria-label="바로가기">
    <a class="btn primary" href="/?from=card">홈페이지 <span class="sub">eunyumade.com</span></a>
    <a class="btn" data-ext="instagram" target="_blank" rel="noopener" hidden>Instagram <span class="sub">↗</span></a>
    <a class="btn" data-ext="youtube" target="_blank" rel="noopener" hidden>YouTube <span class="sub">↗</span></a>
    <a class="btn" data-ext="blog" target="_blank" rel="noopener" hidden>Blog <span class="sub">↗</span></a>
    <a class="btn" data-ext="github" target="_blank" rel="noopener" hidden>GitHub <span class="sub">↗</span></a>
    <a class="btn" id="mailLink" href="mailto:eunyumade01@gmail.com">메일 보내기 <span class="sub" id="mailText">eunyumade01@gmail.com</span></a>
    <div class="row">
      <button class="btn" type="button" id="copyBtn">주소 복사</button>
      <a class="btn" href="/eunyumade.vcf" download="eunyumade.vcf">연락처 저장</a>
    </div>
  </nav>

  <p class="foot">© 2026 EUNYU MADE · <a href="/?from=card">www.eunyumade.com</a></p>
</main>

<script src="site-config.js"></script>
<script>
(function(){
  var cfg = window.EUNYU_CONFIG || {};
  var links = cfg.links || {};
  var email = (cfg.contact && cfg.contact.email) || "eunyumade01@gmail.com";

  document.querySelectorAll("[data-logo]").forEach(function(el){
    if(cfg.brand && cfg.brand.logo) el.src = cfg.brand.logo;
  });
  document.querySelectorAll("[data-img]").forEach(function(el){
    var key = el.getAttribute("data-img");
    if(cfg.images && cfg.images[key]) el.src = cfg.images[key];
  });

  // 외부 링크: site-config.js에 실제 주소가 있을 때만 버튼을 보입니다. "#"이나 빈 값이면 숨김.
  document.querySelectorAll("[data-ext]").forEach(function(el){
    var key = el.getAttribute("data-ext");
    var url = links[key];
    if(!url || url === "#" || !/^https?:\/\//.test(url)) return;
    try{
      var u = new URL(url);
      u.searchParams.set("utm_source","card");
      u.searchParams.set("utm_medium","qr");
      el.href = u.toString();
    }catch(e){ el.href = url; }
    el.hidden = false;
  });

  var mailLink = document.getElementById("mailLink");
  var mailText = document.getElementById("mailText");
  mailLink.href = "mailto:" + email + "?subject=" + encodeURIComponent("[은유제작소] 명함을 보고 연락드립니다");
  mailText.textContent = email;

  var copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", function(){
    var done = function(){
      copyBtn.textContent = "복사됨 ✓";
      setTimeout(function(){ copyBtn.textContent = "주소 복사"; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(email).then(done, function(){ window.prompt("이메일 주소를 복사하세요.", email); });
    }else{
      window.prompt("이메일 주소를 복사하세요.", email);
    }
  });
})();
</script>
</body>
</html>
