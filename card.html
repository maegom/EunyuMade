<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EAF5FD">
  <meta name="description" content="은유제작소 EUNYU MADE 명함 페이지.">
  <title>은유제작소 | 명함</title>
  <link rel="icon" href="assets/logo/eunyu-logo-hand.png">
  <style>
    :root{
      --bg:#EAF5FD; --card:#FFFFFF; --ink:#333333; --muted:#6F8393;
      --line:#CFE5F5; --blue:#3FA9F5; --blue-deep:#2E93DD; --blue-soft:#E3F2FD;
      --shadow:0 16px 48px rgba(63,169,245,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
    body{background:linear-gradient(180deg,#F5FAFE 0%,var(--bg) 100%);min-height:100vh}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font:inherit;color:inherit}
    .wrap{max-width:420px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px 26px;box-shadow:var(--shadow);text-align:center}
    .card img.logo{width:210px;height:auto;margin:0 auto}
    .card .en{margin-top:10px;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--blue)}
    .card .en::before{content:"";display:inline-block;width:6px;height:6px;background:var(--blue);transform:rotate(45deg);margin:0 8px 1px 0;vertical-align:middle}
    .card p{margin:12px 0 0;color:var(--muted);font-size:.96rem}
    .links{display:grid;gap:10px;margin-top:16px}
    .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 20px;border-radius:999px;
      background:var(--card);border:1px solid var(--line);font-weight:700;font-size:1rem;cursor:pointer;text-align:left;width:100%;
      transition:transform .15s ease,background .15s ease,border-color .15s ease}
    .btn:hover{transform:translateY(-1px);border-color:var(--blue)}
    .btn:active{transform:translateY(0)}
    .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
    .btn .l{display:flex;align-items:center;gap:10px}
    .btn svg{width:20px;height:20px;flex:none}
    .btn .sub{font-weight:500;font-size:.8rem;color:var(--muted);white-space:nowrap}
    .btn.primary .sub{color:rgba(255,255,255,.85)}
    .btn[hidden]{display:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .row .btn{justify-content:center}
    .foot{margin-top:20px;text-align:center;font-size:.76rem;color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <img class="logo" src="assets/logo/eunyu-logo-hand.png" alt="은유제작소" onerror="this.onerror=null;this.src='assets/logo/eunyu-logo.png'">
    <div class="en">Eunyu Made</div>
    <p>상상과 생각, 감정을 실제 경험으로 만듭니다.</p>
  </section>

  <nav class="links" aria-label="바로가기">
    <a class="btn primary" data-ext="instagram" target="_blank" rel="noopener" hidden>
      <span class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>Instagram</span><span class="sub">↗</span>
    </a>
    <a class="btn" href="/?from=card">홈페이지 <span class="sub">eunyumade.com</span></a>
    <a class="btn" href="/happy?from=card">HAPPY 체험해보기 <span class="sub">웹 로봇</span></a>
    <a class="btn" data-ext="youtube" target="_blank" rel="noopener" hidden>YouTube <span class="sub">↗</span></a>
    <a class="btn" id="mailLink" href="mailto:eunyumade01@gmail.com">메일 보내기 <span class="sub" id="mailText">eunyumade01@gmail.com</span></a>
    <div class="row">
      <button class="btn" type="button" id="copyBtn">주소 복사</button>
      <a class="btn" href="/eunyumade.vcf" download="eunyumade.vcf">연락처 저장</a>
    </div>
  </nav>

  <p class="foot">© 2026 EUNYU MADE</p>
</main>

<script src="site-config.js"></script>
<script>
(function(){
  var cfg = window.EUNYU_CONFIG || {};
  var links = cfg.links || {};
  var email = (cfg.contact && cfg.contact.email) || "eunyumade01@gmail.com";

  // 외부 링크: site-config.js에 실제 주소가 있을 때만 버튼을 보입니다. "#"이나 빈 값이면 숨김.
  document.querySelectorAll("[data-ext]").forEach(function(el){
    var url = links[el.getAttribute("data-ext")];
    if(!url || url === "#" || !/^https?:\/\//.test(url)) return;
    try{
      var u = new URL(url);
      u.searchParams.set("utm_source","card");
      u.searchParams.set("utm_medium","qr");
      el.href = u.toString();
    }catch(e){ el.href = url; }
    el.hidden = false;
  });

  var mailLink = document.getElementById("mailLink");
  document.getElementById("mailText").textContent = email;
  mailLink.href = "mailto:" + email + "?subject=" + encodeURIComponent("[은유제작소] 명함을 보고 연락드립니다");

  var copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", function(){
    var done = function(){
      copyBtn.textContent = "복사됨 ✓";
      setTimeout(function(){ copyBtn.textContent = "주소 복사"; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(email).then(done, function(){ window.prompt("이메일 주소를 복사하세요.", email); });
    }else{
      window.prompt("이메일 주소를 복사하세요.", email);
    }
  });
})();
</script>
</body>
</html>
