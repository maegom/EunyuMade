name: Build PocketMung Blender package

on:
  push:
    branches:
      - chatgpt/build-pocketmung-blender-20260830
    paths:
      - tools/pocketmung/**
      - .github/workflows/build-pocketmung-blender.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            blender imagemagick zip xvfb python3-numpy \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgles2 mesa-utils
          blender --version
          glxinfo -B || true

      - name: Generate Blender model, renders and print exports
        run: |
          rm -rf dist/pocketmung dist/PocketMung_HappyPlay_Blender_Package.zip
          mkdir -p dist/pocketmung
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b \
            --python tools/pocketmung/build_pocketmung.py \
            -- --output-dir "$GITHUB_WORKSPACE/dist/pocketmung"

      - name: Make six-view preview sheet
        run: |
          montage \
            dist/pocketmung/reference_front.png \
            dist/pocketmung/reference_iso.png \
            dist/pocketmung/reference_right.png \
            dist/pocketmung/reference_rear.png \
            dist/pocketmung/reference_top.png \
            dist/pocketmung/production_front.png \
            -tile 3x2 -geometry 650x650+18+18 \
            -background '#241f1c' \
            dist/pocketmung/PocketMung_preview_sheet.png

      - name: Validate generated blend file
        run: |
          test -s dist/pocketmung/PocketMung_HappyPlay_Detailed.blend
          xvfb-run -a -s "-screen 0 1280x720x24" blender -b \
            dist/pocketmung/PocketMung_HappyPlay_Detailed.blend \
            --python-expr "import bpy; assert 'PocketMung_MASTER' in bpy.data.objects; assert 'Ear_Left_Orange' in bpy.data.objects; assert 'Tail_Teardrop' in bpy.data.objects; print('VALID_BLEND_OBJECTS', len(bpy.data.objects))"

      - name: Package outputs and write checksums
        run: |
          (
            cd dist
            zip -r -9 PocketMung_HappyPlay_Blender_Package.zip pocketmung
          )
          sha256sum \
            dist/PocketMung_HappyPlay_Blender_Package.zip \
            dist/pocketmung/PocketMung_HappyPlay_Detailed.blend \
            dist/pocketmung/PocketMung_reference_assembly.glb \
            dist/pocketmung/PocketMung_production_assembly.glb \
            > dist/pocketmung/SHA256SUMS.txt
          find dist -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: PocketMung-HappyPlay-Blender-Package
          path: |
            dist/PocketMung_HappyPlay_Blender_Package.zip
            dist/pocketmung/PocketMung_HappyPlay_Detailed.blend
            dist/pocketmung/PocketMung_preview_sheet.png
            dist/pocketmung/README_KR.txt
            dist/pocketmung/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Commit generated package to build branch
        run: |
          git config user.name "PocketMung Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/PocketMung_HappyPlay_Blender_Package.zip dist/pocketmung
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build PocketMung Blender package"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
